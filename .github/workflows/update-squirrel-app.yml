name: Update Squirrel cask

on:
  schedule:
    # Daily at 11:57 Asia/Shanghai.
    - cron: "57 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-squirrel-app
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Test updater
        run: |
          gem install minitest --version '~> 5.0' --no-document
          ruby test/update-squirrel-app_test.rb

      - name: Check official stable release and verify installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby scripts/update-squirrel-app.rb

      - name: Validate cask syntax
        run: ruby -c Casks/squirrel-app.rb

      - name: Commit cask update
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git diff --quiet -- Casks/squirrel-app.rb && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/squirrel-app.rb
          git commit -m "squirrel-app $(ruby -ne 'puts $1 if /version "([^"]+)"/' Casks/squirrel-app.rb)"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
