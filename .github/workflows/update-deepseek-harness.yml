name: Update DeepSeek Harness cask

on:
  schedule:
    # Daily at 11:43 Asia/Shanghai.
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-deepseek-harness
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check official feeds and verify release archives
        run: ruby scripts/update-deepseek-harness.rb

      - name: Validate cask syntax
        run: ruby -c Casks/deepseek-harness.rb

      - name: Commit cask update
        run: |
          git diff --quiet -- Casks/deepseek-harness.rb && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/deepseek-harness.rb
          git commit -m "deepseek-harness $(ruby -ne 'puts $1 if /version "([^"]+)"/' Casks/deepseek-harness.rb)"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
